[package]
name = "recorder-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "recorder_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
recorder-engine.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
