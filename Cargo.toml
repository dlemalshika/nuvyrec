[workspace]
members = ["core/recorder-api", "core/recorder-engine", "core/recorder-ffi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
recorder-api = { path = "core/recorder-api" }
recorder-engine = { path = "core/recorder-engine" }
# Explicitly target the FFmpeg 8 development SDK, not the ffmpeg CLI.
ffmpeg-sys-next = { version = "=8.1.0", default-features = false, features = ["avcodec", "avformat", "avfilter", "swresample"] }
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
# Retain unwind semantics for future panic containment at the C ABI boundary.
panic = "unwind"
